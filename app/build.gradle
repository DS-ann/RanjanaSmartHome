plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.smarthome'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.smarthome"
        minSdk 24
        targetSdk 34
        // Increment for every distributed APK so Android treats it as an update.
        versionCode 25
        versionName "1.25"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
